# e8 with the entail2 head: the 2mil7 checkpoint's own NLI head is kept, and
# q(a|=b), q(b|=a) from its entailment output compose EQ/FE/BE/NEG
# (src/modules/model.py) instead of a re-initialised 4-way head. Otherwise
# identical to e8: mDeBERTa-v3-base trained on the
# union of Tracks 1-4 (EN, ES, EU, mixed). Validation decodes with
# `decoding: source`, pooling every language view of a source pair in the dev
# files — the same pooling used at submission time.

data_root: data/raw/dico/final_data
train_files:
  - train/dico_nli_train_track1_participant_labeled.csv
  - train/dico_nli_train_track2_participant_labeled.csv
  - train/dico_nli_train_track3_participant_labeled.csv
  - train/dico_nli_train_track4_participant_labeled.csv
val_files:
  - dev/dico_nli_dev_track1_participant_labeled.csv
  - dev/dico_nli_dev_track2_participant_labeled.csv
  - dev/dico_nli_dev_track3_participant_labeled.csv
  - dev/dico_nli_dev_track4_participant_labeled.csv
test_files: []
# Label-safe train-only augmentation (src/augment.py): reverse_negatives, transitive
augment: []
seed: 42

ckpt_dir: checkpoints
result_dir: results
run_name: e20_mdeberta_entail2

epochs: 20
batch_size: 32
pin_memory: true
amp: true
lr: 1.5e-5
weight_decay: 0.01
log_every: 100
eval_every: 1
ckpt_every: 0

consistency_weight: 0.0  # entail2 is reversal-equivariant by construction

decoding: source
neg_bias: 0.0
structural_prior: false

arch:
  backbone: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  max_length: 128
  head: entail2

lr_scheduler:
  type: warmup_linear
  t_max: auto
  warmup_ratio: 0.1
early_stopping:
  enabled: true
  monitor: dico_mean
  mode: max
  patience: 5
save_best: true
best_metric: dico_mean
best_mode: max

wandb:
  enabled: true
  project: dico-nli
epoch_fraction: 0.15
